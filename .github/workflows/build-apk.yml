name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable

      - run: flutter pub get

      - run: flutter analyze

      # -j 1: several test files open the same on-disk sqlite fixture
      # (sqflite_common_ffi has no per-test-file isolation), so concurrent
      # runners can race for its file lock. Serializing avoids flaky
      # "database is locked" failures.
      - run: flutter test -j 1

      - run: flutter build apk --release

      # continue-on-error: this step only publishes the built APK for
      # download — flutter analyze/test/build above already validated the
      # change. The repo's Actions storage quota has intermittently been
      # hit here ("Failed to CreateArtifact: Artifact storage quota has
      # been hit"), which previously failed otherwise-green runs for a
      # reason unrelated to the code being built.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
